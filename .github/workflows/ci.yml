name: NeuralRetail CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.10]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # 🔍 LINT CHECK
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      # 🧪 UNIT TESTS
      - name: Run Tests
        run: |
          pip install pytest
          pytest

      # 📊 MODEL VALIDATION (IMPORTANT)
      - name: Model Validation
        run: |
          python backend/ci/model_validation.py